name: Android build (fork)

# Added in the fryorcraken/logos-storage-nim fork. Proves that
# `make libstorage-android` — the Android cross-compilation support this fork
# adds on top of upstream logos-storage/logos-storage-nim — actually produces
# a valid libstorage.so for every supported Android ABI. Not present upstream.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  cache_nonce: 0
  nim_version: pinned
  # NDK r27 is the current official LTS release (developer.android.com/ndk/downloads),
  # and matches the NDK already installed locally (~/android-ndk/android-ndk-r27c).
  # No upstream Android CI exists in logos-messaging/logos-delivery to cross-check
  # against — that repo's Android make targets aren't wired into any of its own
  # workflows — so this is the best available anchor, not a value copied from
  # a known-working CI config. Revisit if a build fails against it.
  android_ndk_version: 27.2.12479018
  android_target: "30"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  android-build:
    name: libstorage-android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            make_target: libstorage-android-arm64
          - abi: x86_64
            make_target: libstorage-android-amd64
          - abi: x86
            make_target: libstorage-android-x86
          - abi: armeabi-v7a
            make_target: libstorage-android-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Android NDK
        id: setup-ndk
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.android_ndk_version }}
        run: |
          sdkmanager --install "ndk;${{ env.android_ndk_version }}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ env.android_ndk_version }}" >> "$GITHUB_ENV"

      - name: Setup Nimbus Build System
        uses: ./.github/actions/nimbus-build-system
        with:
          os: linux
          nim_version: ${{ env.nim_version }}

      - name: Build libstorage.so for ${{ matrix.abi }}
        env:
          ANDROID_TARGET: ${{ env.android_target }}
        run: |
          make -j${ncpu} ${{ matrix.make_target }}

      - name: Verify output
        run: |
          f="build/android/${{ matrix.abi }}/libstorage.so"
          test -f "$f" || { echo "::error::$f was not produced"; exit 1; }
          file "$f"

      - name: Upload libstorage.so (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: libstorage-android-${{ matrix.abi }}
          path: build/android/${{ matrix.abi }}/libstorage.so
          if-no-files-found: error
